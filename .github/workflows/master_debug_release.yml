name: Debug APK Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: master-debug-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Copy APK to Release Asset Name
        run: cp app/build/outputs/apk/debug/app-debug.apk GroupingMessages-debug.apk
      - name: Compute Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GroupingMessages-debug
          path: GroupingMessages-debug.apk
          if-no-files-found: ignore
      - name: Publish Rolling Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: GroupingMessages-debug.apk
          body: |
            Auto-built debug APK from ${{ github.ref_name }} @ ${{ steps.sha.outputs.short }}.
            This asset is replaced automatically on every push to main/master.

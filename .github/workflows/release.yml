name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for a manual release'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve tag and version code
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version_name: ${{ steps.resolve.outputs.version_name }}
      version_code: ${{ steps.resolve.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag and version code
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            LATEST_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo v1.7.0)"
            CLEAN_VERSION="${LATEST_TAG#v}"
            CLEAN_VERSION="${CLEAN_VERSION%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
            MAJOR="${MAJOR:-1}"
            MINOR="${MINOR:-7}"
            PATCH="${PATCH:-0}"
            case "$BUMP" in
              major) MAJOR=$((10#$MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((10#$MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((10#$PATCH + 1)) ;;
              *) echo "::error::Unknown bump: $BUMP"; exit 1 ;;
            esac
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
            VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
            VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))

            python3 scripts/update_fdroid_metadata.py \
              "$VERSION_NAME" "$VERSION_CODE" "$TAG"
            sed -i -E "s/^    versionCode = .*/    versionCode = ${VERSION_CODE}/" build.gradle
            sed -i -E "s/^    versionName = .*/    versionName = '${VERSION_NAME}'/" build.gradle

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add metadata/in.rahulja.groupingmessages.yml build.gradle
            git commit -m "chore(release): ${TAG} [skip ci]" || true
            git push origin "HEAD:${REF_NAME}"
            git tag -a "$TAG" -m "Grouping Messages ${VERSION_NAME}"
            git push origin "$TAG"
          else
            TAG="${REF_NAME}"
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag must be vX.Y.Z, got: $TAG"
              exit 1
            fi
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG does not exist in this repository."
              exit 1
            fi
            VERSION_NAME="${TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
            VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          fi

          if [ "$VERSION_CODE" -le 0 ]; then
            echo "::error::Invalid version code for $TAG"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG -> $VERSION_NAME ($VERSION_CODE)"

  verify:
    name: Unit tests and lint
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew lintDebug --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

  build:
    name: Build, verify, sign
    needs: [version, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build unsigned release twice and compare
        env:
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
          VERSION_CODE: ${{ needs.version.outputs.version_code }}
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            --no-build-cache --stacktrace
          cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/release-first.apk
          sha256sum /tmp/release-first.apk | tee /tmp/release-first.sha256

          ./gradlew clean assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            --no-build-cache --stacktrace
          cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/release-second.apk

          if ! cmp -s /tmp/release-first.apk /tmp/release-second.apk; then
            echo "::error::Release build is not reproducible: the two clean builds differ."
            exit 1
          fi
          echo "Reproducible unsigned release build confirmed."

          ./gradlew assembleDebug \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            --stacktrace

      - name: Sign and verify APK
        env:
          KEY_STORE_BASE64: ${{ secrets.KEY_STORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
          VERSION_CODE: ${{ needs.version.outputs.version_code }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_STORE_BASE64:-}" ] || [ -z "${KEY_STORE_PASSWORD:-}" ] \
            || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Signing secrets are missing. Set KEY_STORE_BASE64, KEY_STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 1
          fi

          umask 077
          KEYSTORE_DIR="$RUNNER_TEMP/keystore"
          mkdir -p "$KEYSTORE_DIR"
          KEYSTORE="$KEYSTORE_DIR/release.jks"
          printf '%s' "$KEY_STORE_BASE64" | base64 --decode > "$KEYSTORE"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name zipalign -type f | sort -V | tail -n 1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ -z "$ZIPALIGN" ] || [ -z "$AAPT2" ]; then
            echo "::error::Android build-tools (apksigner/zipalign/aapt2) not found."
            exit 1
          fi

          mkdir -p dist
          OUT="dist/in.rahulja.groupingmessages-${VERSION_NAME}.apk"
          DEBUG_OUT="dist/in.rahulja.groupingmessages-${VERSION_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEBUG_OUT"
          (cd dist && sha256sum "$(basename "$DEBUG_OUT")" > "$(basename "$DEBUG_OUT").sha256")

          "$ZIPALIGN" -f 4 /tmp/release-first.apk /tmp/release-aligned.apk
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KEY_STORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out "$OUT" \
            /tmp/release-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs "$OUT"
          "$ZIPALIGN" -c -v 4 "$OUT"

          BADGING="$("$AAPT2" dump badging "$OUT")"
          echo "$BADGING" | grep -q "package: name='in.rahulja.groupingmessages'" \
            || { echo "::error::Unexpected package name"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='${VERSION_CODE}'" \
            || { echo "::error::Unexpected versionCode"; exit 1; }
          echo "$BADGING" | grep -q "versionName='${VERSION_NAME}'" \
            || { echo "::error::Unexpected versionName"; exit 1; }
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "::error::Release APK is debuggable"
            exit 1
          fi
          if "$AAPT2" dump xmltree --file AndroidManifest.xml "$OUT" | grep -q "testOnly"; then
            echo "::error::Release APK is testOnly"
            exit 1
          fi

          (cd dist && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")
          cat "$OUT.sha256"
          rm -f /tmp/release-first.apk /tmp/release-second.apk /tmp/release-aligned.apk

      - name: Remove signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"

      - name: Assert no keystore in workspace
        run: |
          set -euo pipefail
          if find "$GITHUB_WORKSPACE" -name '*.jks' -print -quit | grep -q .; then
            echo "::error::A keystore was found in the workspace"
            exit 1
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: dist/
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Grouping Messages ${{ needs.version.outputs.version_name }}
          files: |
            dist/*.apk
            dist/*.apk.sha256
          draft: false
          prerelease: false
          generate_release_notes: true

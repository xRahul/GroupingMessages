plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'in.rahulja.groupingmessages'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId rootProject.ext.applicationId
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        // CI overrides via -PversionCode= -PversionName= (release.yml); local defaults preserved.
        versionCode ((project.findProperty('versionCode') as Integer) ?: rootProject.ext.versionCode)
        versionName (project.findProperty('versionName') ?: rootProject.ext.versionName)

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        resConfigs 'en'
    }

    def releaseStoreFile = System.getenv("STORE_FILE")
    if (releaseStoreFile != null) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword System.getenv("KEY_STORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    } else {
        println "NOTE: STORE_FILE not set; release build will stay UNSIGNED."
        println "Set STORE_FILE, KEY_STORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD to sign it."
    }

    buildTypes {
        debug {
            debuggable true
            shrinkResources false
            minifyEnabled false
            proguardFile 'proguard-guava.pro'
            proguardFile getDefaultProguardFile('proguard-android-optimize.txt')
            proguardFile 'proguard-rules.pro'
        }
        release {
            if (releaseStoreFile != null) {
                signingConfig signingConfigs.release
            }
            shrinkResources true
            minifyEnabled true
            proguardFile 'proguard-guava.pro'
            proguardFile getDefaultProguardFile('proguard-android-optimize.txt')
            proguardFile 'proguard-rules.pro'
            debuggable false
            jniDebuggable false
            zipAlignEnabled true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

configurations.configureEach {
    exclude group: 'com.google.guava', module: 'listenablefuture'
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.preference
    implementation libs.material

    // Kept until CardView usages migrate to MaterialCardView (see improvements.md GM-031).
    implementation libs.androidx.cardview

    implementation libs.androidx.recyclerview
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.lifecycle.viewmodel

    // QuadFlask colorpicker declares unused com.android.support:* deps (no android.support
    // references exist in its bytecode); excluded so jetifier can stay off (GM-005).
    implementation(libs.colorpicker) {
        exclude group: 'com.android.support'
    }
    implementation libs.simmetrics.core

    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    testImplementation libs.androidx.test.core
    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.robolectric
}

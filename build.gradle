// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
  repositories {
    google()
    mavenCentral()
    // SonarQube scanner plugin: newer versions live on the Gradle Plugin Portal.
    gradlePluginPortal()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:9.3.1'
    classpath 'org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:7.4.0.8496'

    // NOTE: Do not place your application dependencies here; they belong
    // in the individual module build.gradle files
  }
}

apply plugin: 'org.sonarqube'

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
  }
}

task clean(type: Delete) {
  delete rootProject.buildDir
}

// This block encapsulates custom properties and makes them available to all
// modules in the project.
ext {
  // The following are only a few examples of the types of properties you can define.
  compileSdkVersion = 35
  // You can also create properties to specify versions for dependencies.
  // Having consistent versions between modules can avoid conflicts with behavior.
  minSdkVersion = 24
  targetSdkVersion = 35
  jUnitVersion = '4.13.2'
  applicationId = 'in.rahulja.groupingmessages'
  versionCode = 16
  versionName = '1.6'
}

sonar {
  properties {
    property 'sonar.host.url', System.getenv('SONAR_HOST_URL') ?: 'https://sonarcloud.io'
    property 'sonar.organization', System.getenv('SONAR_ORG') ?: 'xrahul-github'
    property 'sonar.projectKey', System.getenv('SONAR_PROJECT_KEY') ?: 'GroupingMessages:app'
    property 'sonar.sourceEncoding', 'UTF-8'
  }
}
